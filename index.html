<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Nombre</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #7b2ff7);
            background-size: 400% 400%;
            animation: colores 8s ease infinite;

            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            font-size: 90px;
            text-align: center;
            text-shadow: 4px 4px 10px rgba(0, 0, 0, 0.4);
        }

        @keyframes colores {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>

<body>

    <h1>Valeria Monserrath Aguirre Martinez</h1>

</body>
</html>
